<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | MOIRAS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MOIRAS</h1>
        <p>Arte feita à mão, histórias compartilhadas.</p>
    </header>

    <main class="pagina-autenticacao">
        <section class="caixa-autenticacao">
            <h2>Crie sua conta </h2>
            <p>Venha compartilhar sua paixão pelo artesanato!</p>

           <form action="cadastro.php" method="POST" id="form-cadastro">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       placeholder="Digite seu e-mail" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       placeholder="Crie uma senha" required minlength="6">

                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha"
                       name="confirmar-senha"
                       placeholder="Digite a senha novamente"
                       required minlength="6">

                <button type="submit">Criar minha conta</button>
            </form>
